<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BIEK Result 2026 - SG</title>
    <!-- PDF buffer ke liye frame -->
    <iframe id="pdf-frame" src="" width="100%" height="95vh" frameborder="0"></iframe>
    
    <!-- Simple Loading Animation -->
    <style>body { margin: 0; padding: 0; background: #fff; overflow: hidden; } 
            .loader { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:-1;} </style>
</head>
<body style="margin:0; padding:20px;">
    
    <!-- Loader (Loading time ke liye) -->
    <div class="loader" style="background:#f4f4f4;">
        <h3>Loading Result PDF...</h3>
        <p>Please wait a moment.</p>
    </div>

    <!-- Script jo asli link ko buffer mein load karega taake error na ho -->
    <script>
        // Asli BIEK ka link yahan hai, lekin hum ise iframe ke zariye safe karein ge
        const originalUrl = "https://biek.edu.pk/Result-2026/Annual/PART-I/SG.pdf";
        
        document.getElementById("pdf-frame").src = originalUrl;

        window.onload = function() {
            setTimeout(() => {
                const loader = document.querySelector(".loader");
                if(loader) loader.style.display = "none"; // Loader hide kar dein jab load ho jaye
                
                console.log("BIEK Result Loaded Successfully via Buffer.");
            }, 1500); // 1.5 seconds baad loading text gayab hoga
            
            // Agar user ko download button chahiye toh yeh optional code hai:
            /*
            <a href="https://biek.edu.pk/Result-2026/Annual/PART-I/SG.pdf" target="_blank">Direct Download</a>
            */
        };
    </script>

</body>
</html>
